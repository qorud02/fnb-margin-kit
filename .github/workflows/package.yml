name: Package container and wheel

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version matching pyproject.toml (without v)"
        required: true
        default: "0.7.0"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'qorud02/fnb-margin-kit' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select build Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Check version and release source
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python scripts/prepare_package.py
      - name: Check package source
        run: |
          python -m pip install . -r requirements-test.txt
          python -m unittest discover -s tests -v
      - name: Build local container
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_NAME: ${{ steps.version.outputs.image }}
        run: docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$IMAGE_NAME:$PACKAGE_VERSION" .
      - name: Test the exact container before publishing
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_NAME: ${{ steps.version.outputs.image }}
        run: python scripts/package_smoke.py --container "$IMAGE_NAME:$PACKAGE_VERSION"
      - name: Test recipe costing in the exact container
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_NAME: ${{ steps.version.outputs.image }}
        run: python scripts/recipe_smoke.py --container "$IMAGE_NAME:$PACKAGE_VERSION"
      - name: Test stock-aware procurement in the exact container
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_NAME: ${{ steps.version.outputs.image }}
        run: python scripts/procurement_smoke.py --container "$IMAGE_NAME:$PACKAGE_VERSION"
      - name: Build Python wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify wheel contents against release source
        run: python scripts/verify_wheel.py dist
      - name: Verify installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-index --no-deps dist/*.whl
          python scripts/package_smoke.py --python "$RUNNER_TEMP/wheel-venv/bin/python" --console "$RUNNER_TEMP/wheel-venv/bin/fnb-margin"
          python scripts/recipe_smoke.py --python "$RUNNER_TEMP/wheel-venv/bin/python" --console "$RUNNER_TEMP/wheel-venv/bin/fnb-recipe"
          python scripts/procurement_smoke.py --python "$RUNNER_TEMP/wheel-venv/bin/python" --console "$RUNNER_TEMP/wheel-venv/bin/fnb-procure"
      - name: Build downloadable working example
        run: python scripts/build_release_examples.py
      - name: Attest tested wheel provenance
        id: wheel_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.whl
      - name: Keep signed provenance bundle
        run: cp "${{ steps.wheel_provenance.outputs.bundle-path }}" dist/provenance.json
      - name: Save wheel and checksums
        uses: actions/upload-artifact@v4
        with:
          name: fnb-margin-kit-${{ steps.version.outputs.version }}-wheel
          path: |
            dist/*.whl
            dist/SHA256SUMS
            dist/provenance.json
            dist/procurement-example.zip
          if-no-files-found: error
          retention-days: 30
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_NAME: ${{ steps.version.outputs.image }}
        run: |
          docker push "$IMAGE_NAME:$PACKAGE_VERSION"
          printf 'Container: %s:%s\n' "$IMAGE_NAME" "$PACKAGE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf 'Wheel: download this run artifact or the corresponding release asset.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish versioned release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --draft dist/*.whl dist/SHA256SUMS dist/provenance.json dist/procurement-example.zip --verify-tag --title "$RELEASE_TAG - Offline purchase report" --notes-file docs/releases/v0.7.0.md
      - name: Download and verify staged release wheel
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir "$RUNNER_TEMP/published-wheel"
          gh release download "$RELEASE_TAG" --pattern '*.whl' --pattern SHA256SUMS --dir "$RUNNER_TEMP/published-wheel"
          (cd "$RUNNER_TEMP/published-wheel" && sha256sum --check SHA256SUMS --ignore-missing)
          gh attestation verify "$RUNNER_TEMP/published-wheel/"*.whl --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/package.yml" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners --format json > dist/published-wheel-verification.json
          gh release upload "$RELEASE_TAG" dist/published-wheel-verification.json
          printf 'Published wheel verified against source %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Attestation: %s\n' '${{ steps.wheel_provenance.outputs.attestation-url }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish checked release and verify public asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --latest
          mkdir "$RUNNER_TEMP/public-wheel"
          gh release download "$RELEASE_TAG" --pattern '*.whl' --pattern SHA256SUMS --dir "$RUNNER_TEMP/public-wheel"
          (cd "$RUNNER_TEMP/public-wheel" && sha256sum --check SHA256SUMS --ignore-missing)
          gh attestation verify "$RUNNER_TEMP/public-wheel/"*.whl --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/package.yml" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners --format json > "$RUNNER_TEMP/public-wheel-verification.json"
          gh release view "$RELEASE_TAG" --json url,isDraft,tagName
