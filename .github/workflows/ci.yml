name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: fnb-margin examples/menu.csv --output-dir smoke-report --fixed-cost 300000
      - run: fnb-margin examples/store-versus-delivery.csv --channel-costs examples/channel-costs.csv --fixed-cost 300000 --output-dir smoke-channel-costs
      - run: fnb-margin examples/store-versus-delivery.csv --channel-costs examples/channel-costs.csv --fixed-cost 300000 --html --output-dir smoke-dashboard
      - run: python -c "from pathlib import Path; from fnb_margin_kit.html_report import render_html; import json; p=Path('smoke-dashboard'); assert p.joinpath('report.html').read_text(encoding='utf-8') == render_html(json.loads(p.joinpath('report.json').read_text(encoding='utf-8')))"
      - run: fnb-margin examples/price-cost-scenarios/baseline.csv --compare-menu examples/price-cost-scenarios/proposed.csv --channel-costs examples/price-cost-scenarios/baseline-channel-costs.csv --compare-channel-costs examples/price-cost-scenarios/proposed-channel-costs.csv --fixed-cost 300000 --html --output-dir smoke-comparison
      - run: python -c "from pathlib import Path; import json; from decimal import Decimal; p=Path('smoke-comparison'); c=json.loads(p.joinpath('comparison.json').read_text(encoding='utf-8')); assert Decimal(c['summary']['delta']['contribution_after_specified_fixed_cost'])==Decimal('3468'); assert c['baseline']==json.loads(p.joinpath('report.json').read_text(encoding='utf-8')); assert p.joinpath('comparison.md').is_file()"
      - run: fnb-recipe examples/recipe-costing/ingredients.csv examples/recipe-costing/recipes.csv --menu examples/recipe-costing/menu.csv --output-dir smoke-recipes
      - run: python -c "from pathlib import Path; import json; p=Path('smoke-recipes'); c=json.loads(p.joinpath('recipe-costs.json').read_text(encoding='utf-8')); assert len(c['recipe_lines'])==9 and len(c['menus'])==4; r=c['menus'][0]; assert r['ingredient_cost']['numerator']=='19008' and r['ingredient_cost']['denominator']=='19' and r['export_ingredient_cost']=='1000.421052631579'; assert p.joinpath('menu-ingredient-costs.csv').is_file()"
      - run: fnb-margin smoke-recipes/costed-menu.csv --html --output-dir smoke-recipe-margins
